[[questions]]
id = "urgency"
text = "Is water leaking now, or can it wait for a booked visit?"
required = true

[[questions]]
id = "address"
text = "What is the address of the property?"
required = true

[[questions]]
id = "name"
text = "What is your name?"
required = true

[[questions]]
id = "contact"
text = "What is the best phone number to reach you on?"
required = true

[hours]
monday = { open = "08:00", close = "18:00" }
tuesday = { open = "08:00", close = "18:00" }
wednesday = { open = "08:00", close = "18:00" }
thursday = { open = "08:00", close = "18:00" }
friday = { open = "08:00", close = "18:00" }
saturday = { open = "09:00", close = "14:00" }
sunday = { closed = true }

[followups]
touch_delays_hours = [4, 24, 72]
max_touches = 3
waking_window_start = "08:00"
waking_window_end = "21:00"

[handoff]
emergency_terms = ["gas smell", "burst pipe", "flooding", "water pouring", "no water"]
emergency_instruction = "This sounds urgent. Turn off the water at the stopcock if you can do so safely, and if you smell gas, leave the property and call your local gas emergency service."
