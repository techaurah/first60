# SwiftFlow Plumbing - fictional business pack for First60.
# No real business data. Used by the pack tests.

[business]
name = "SwiftFlow Plumbing"
vertical = "plumber"
timezone = "Europe/London"
currency = "GBP"

[[services]]
name = "Emergency call-out"
duration_minutes = 60
value_tier = "high"
description = "Urgent visit for leaks, flooding or loss of water."

[[services]]
name = "Leak repair"
duration_minutes = 60
value_tier = "standard"
description = "Find and fix a leaking pipe, tap or fitting."

[[services]]
name = "Boiler service"
duration_minutes = 60
value_tier = "standard"
description = "Annual boiler service and safety check."

[[services]]
name = "Boiler repair"
duration_minutes = 90
value_tier = "high"
description = "Diagnose and repair a faulty boiler."

[[services]]
name = "Bathroom installation"
duration_minutes = 240
value_tier = "high"
description = "Fit a new bathroom suite."

[[services]]
name = "Tap replacement"
duration_minutes = 30
value_tier = "low"
